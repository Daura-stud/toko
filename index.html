<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Laurel | Produk Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3E8; --card:#FFFFFF; --ink:#12261C; --muted:#5b6b60;
  --forest:#123524; --forest2:#1F5C3E; --lime:#B7FF5C; --amber:#E7A94C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0d1912; --card:#153524; --ink:#eef5ee; --muted:#9db3a6; }
}
:root[data-theme="dark"]{ --bg:#0d1912; --card:#153524; --ink:#eef5ee; --muted:#9db3a6; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.55;}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;}
.wrap{max-width:980px;margin:0 auto;padding:0 20px;}
nav.top{position:sticky;top:0;z-index:10;background:var(--forest);color:#f3f7ee;padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px;}
nav.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:20px;color:var(--lime);}
.navlinks{display:flex;gap:6px;flex-wrap:wrap;}
.navlinks a{color:#dfeee0;text-decoration:none;font-size:14px;font-weight:600;padding:7px 12px;border-radius:20px;}
.navlinks a.active{background:var(--lime);color:var(--forest);}
.badge{background:var(--amber);color:var(--forest);font-size:11px;font-weight:800;border-radius:50%;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;padding:0 4px;}
.folder-card{background:var(--card);border-radius:16px;padding:24px 20px;box-shadow:0 8px 24px rgba(18,53,36,.08);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:transform .15s;}
.folder-card:hover{transform:translateY(-3px);}
.folder-icon{font-size:34px;}
.folder-card h3{font-size:18px;}
.folder-card .count{font-size:12px;color:var(--muted);}
.back-link{display:inline-block;margin-bottom:18px;color:var(--forest2);font-weight:700;font-size:14px;text-decoration:none;}
main{padding:40px 0 70px;}
.digital-note{background:var(--forest2);color:#eafbe9;border-radius:14px;padding:14px 18px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:28px;}
.hero h1{font-size:clamp(28px,5.5vw,44px);line-height:1.1;max-width:600px;}
.hero p{color:var(--muted);max-width:520px;margin-top:14px;font-size:17px;}
.btn{display:inline-block;border:none;border-radius:12px;padding:13px 24px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--lime);color:var(--forest);margin-top:22px;}
.quicklinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:36px;}
.qcard{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,53,36,.08);text-decoration:none;color:var(--ink);}
.qcard h3{font-size:18px;margin-bottom:6px;}
.qcard p{color:var(--muted);font-size:13px;margin:0;}
.page-head{margin-bottom:26px;}
.page-head h2{font-size:clamp(24px,4vw,32px);}
.page-head p{color:var(--muted);margin-top:6px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,240px));gap:18px;}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,53,36,.08);display:flex;flex-direction:column;gap:9px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s;}
.card:has(input:checked){box-shadow:0 0 0 3px var(--forest2),0 8px 24px rgba(18,53,36,.15);transform:translateY(-2px);}
.card input{position:absolute;top:14px;right:14px;width:19px;height:19px;accent-color:var(--forest2);}
.thumb.has-img{height:auto;aspect-ratio:3/4;background:var(--bg);overflow:hidden;}
.thumb.has-img img{width:100%;height:100%;object-fit:contain;border-radius:0;}
.tlink{color:inherit;text-decoration:none;}
@media (max-width:560px){.grid{grid-template-columns:1fr;}}
.order-done{border:2px solid var(--forest2);margin-bottom:26px;}
.done-title{font-size:20px;color:var(--forest2);margin-bottom:10px;}
.steps{margin:0 0 18px;padding-left:20px;font-size:14px;line-height:1.75;}
.steps a{color:var(--forest2);font-weight:700;}
.btn-wa{background:#25D366;color:#fff;margin-top:18px;}
.link-btn{background:none;border:none;color:var(--forest2);font-weight:700;cursor:pointer;margin-left:14px;font-size:14px;text-decoration:underline;font-family:Inter,sans-serif;}
.next-title{font-size:18px;margin:8px 0 14px;}
.detail-link{font-size:13px;font-weight:700;color:var(--forest2);text-decoration:none;}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:30px;align-items:start;}
@media (max-width:720px){.detail{grid-template-columns:1fr;}}
.gal-main{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(18,53,36,.08);}
.gal-main img{width:100%;height:auto;max-height:540px;object-fit:contain;display:block;border-radius:10px;}
.gal-emoji{font-size:80px;text-align:center;padding:50px 0;}
.gal-thumbs{display:flex;gap:10px;margin-top:12px;}
.gal-t{flex:1;border:2px solid transparent;background:var(--card);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);font-family:Inter,sans-serif;}
.gal-t img{width:100%;height:70px;object-fit:contain;border-radius:8px;}
.gal-t.on{border-color:var(--forest2);color:var(--forest2);}
.detail-info .cat{display:inline-block;font-size:11px;font-weight:700;color:var(--forest2);background:#e4f3e7;border-radius:20px;padding:3px 10px;}
.detail-info h2{font-size:clamp(24px,4vw,32px);margin-top:8px;line-height:1.15;}
.detail-info .sub{color:var(--muted);margin:4px 0 0;font-weight:600;}
.price.big{font-size:26px;margin:14px 0 10px;}
.facts{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);}
.long{font-size:14px;margin:0 0 10px;}
.benefits{margin:0 0 12px;padding-left:20px;font-size:14px;}
.detail-info .qty-stepper,.detail-info .add-btn{margin-top:10px;}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
.thumb{height:80px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,var(--forest),var(--forest2));}
.card h3{font-size:17px;}
.card .cat{display:inline-block;font-size:11px;font-weight:700;color:var(--forest2);background:#e4f3e7;border-radius:20px;padding:3px 9px;width:fit-content;}
:root[data-theme="dark"] .card .cat{background:#1e3f2c;color:var(--lime);}
.card p.desc{color:var(--muted);font-size:13px;margin:0;flex:1;}
.price{font-weight:700;color:var(--forest2);font-size:17px;}
.pick-label{background:var(--forest);color:#eafbe9;padding:9px;border-radius:9px;text-align:center;font-size:13px;font-weight:700;border:none;cursor:pointer;width:100%;font-family:Inter,sans-serif;}
.qty-stepper{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--bg);border-radius:9px;padding:6px;}
.qty-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--forest2);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.qty-val{font-weight:700;min-width:16px;text-align:center;}
.cart-total{font-size:17px;font-weight:700;color:var(--forest2);margin-bottom:18px;text-align:right;}
.cat-section{margin-bottom:36px;}
.cat-title{font-size:20px;margin-bottom:14px;color:var(--forest2);}
.cart-bar{position:sticky;bottom:14px;margin-top:26px;background:var(--forest);color:#fff;border-radius:14px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.cart-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.cart-item{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.cart-item button{border:none;background:#f4d9d9;color:#a33;font-weight:700;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;}
.empty-cart{color:var(--muted);font-size:14px;padding:20px;text-align:center;background:var(--card);border-radius:14px;}
.pay{background:var(--card);border-radius:16px;padding:24px;margin-top:24px;}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
@media (max-width:620px){.pay-grid{grid-template-columns:1fr;}}
.btn-save-qr{display:block;text-align:center;margin-top:10px;background:var(--forest2);color:#fff;font-size:13px;padding:10px;border-radius:9px;text-decoration:none;font-weight:700;}
.qris-box{aspect-ratio:1/1;max-width:200px;border:3px dashed var(--forest2);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:12px;padding:12px;}
.checkout-form{display:flex;flex-direction:column;gap:12px;}
.checkout-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);}
.checkout-form input{border:2px solid #dbe6dc;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);background:var(--bg);}
.checkout-form input:focus{outline:none;border-color:var(--forest2);}
.form-hint{font-size:12px;color:var(--muted);margin:0 0 4px;}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.acc-row span{display:block;color:var(--muted);font-size:12px;}
.acc-row strong{font-size:16px;}
.copy-btn{border:none;background:var(--forest2);color:#fff;font-size:11px;font-weight:700;padding:6px 9px;border-radius:8px;cursor:pointer;flex-shrink:0;}
.wa-note{font-size:12px;color:var(--muted);margin-top:16px;}
footer{padding:28px 0 50px;text-align:center;color:var(--muted);font-size:13px;}
.wa-float{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#25D366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:5;}
</style>
</head>
<body>

<nav class="top">
  <div class="wrap row">
    <div class="brand">🌿 Studio Laurel</div>
    <div class="navlinks" id="navlinks">
      <a href="#dasbor" data-r="dasbor">Dasbor</a>
      <a href="#produk" data-r="produk">Produk</a>
      <a href="#kategori" data-r="kategori">Kategori</a>
      <a href="#keranjang" data-r="keranjang">Keranjang<span class="badge" id="navBadge">0</span></a>
    </div>
  </div>
</nav>

<main class="wrap"><div id="app"></div></main>

<footer class="wrap">© 2026 Studio Laurel — semua produk berbentuk file digital, dikirim setelah pembayaran dikonfirmasi.</footer>

let memCart = {};
try { memCart = JSON.parse(localStorage.getItem(CART_KEY) || '{}'); } catch(e) { memCart = {}; }

function getCart(){
  return memCart;
}
function setCart(cart){
  memCart = cart;
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch(e){ /* localStorage tidak tersedia (mis. dibuka via file://), tetap jalan di memori selama halaman ini terbuka */ }
  updateBadge();
}
function changeQty(id, delta){
  const cart = getCart();
  const next = (cart[id] || 0) + delta;
  if (next <= 0) delete cart[id]; else cart[id] = next;
  setCart(cart);
  render();
}
function cartTotalQty(){
  return Object.values(getCart()).reduce((a,b) => a+b, 0);
}
function updateBadge(){
  document.getElementById('navBadge').textContent = cartTotalQty();
}
function updateWaLink(){
  const cart = getCart();
  const names = PRODUCTS.filter(p => cart[p.id]).map(p => p.name + ' x' + cart[p.id]);
  const msg = names.length ? 'Halo, saya mau tanya soal: ' + names.join(', ') : 'Halo, saya mau tanya-tanya produk';
  document.getElementById('waFloat').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg);
}

function digitalNote(){
  return '<div class="digital-note">📦 <span><strong>Produk digital (file PDF)</strong>, bukan barang fisik. Setelah bayar, file dikirim lewat WhatsApp.</span></div>';
}

function rp(v){
  const n = parseFloat(String(v).replace(/[^\d.]/g,''));
  return isNaN(n) ? 'Rp ' + v : 'Rp ' + n.toLocaleString('id-ID');
}

function cartControls(p){
  const qty = getCart()[p.id] || 0;
  return qty > 0
    ? '<div class="qty-stepper" data-id="'+p.id+'">'
        + '<button type="button" class="qty-btn" data-act="dec" data-id="'+p.id+'">−</button>'
        + '<span class="qty-val">'+qty+'</span>'
        + '<button type="button" class="qty-btn" data-act="inc" data-id="'+p.id+'">+</button>'
      + '</div>'
    : '<button type="button" class="pick-label add-btn" data-id="'+p.id+'">+ Tambah ke Keranjang</button>';
}

function coverOf(p){ return (p.imgs && p.imgs[0]) || p.img || ''; }

function productCard(p){
  const cover = coverOf(p);
  const thumb = cover
    ? '<a class="thumb has-img" href="#detail/'+p.id+'"><img src="'+cover+'" alt="'+p.name+'"></a>'
    : '<a class="thumb" href="#detail/'+p.id+'">'+p.emoji+'</a>';
  return '<div class="card">'
    + thumb
    + '<span class="cat">'+p.category+'</span>'
    + '<h3><a class="tlink" href="#detail/'+p.id+'">'+p.name+'</a></h3>'
    + '<p class="desc">'+p.desc+'</p>'
    + '<div class="price">'+rp(p.price)+'</div>'
    + '<a class="detail-link" href="#detail/'+p.id+'">Lihat contoh isi →</a>'
    + cartControls(p)
    + '</div>';
}

const galIdx = {};

  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return '<div class="empty-cart">Produk tidak ditemukan. <a href="#produk">Kembali ke produk</a></div>';

  let gallery;
  if (imgs.length){
    gallery = '<div class="gal-main"><img src="'+imgs[i]+'" alt="'+p.name+'"></div>';
    if (imgs.length > 1){
      gallery += '<div class="gal-thumbs">' + imgs.map((src,k) =>
        '<button type="button" class="gal-t'+(k===i?' on':'')+'" data-gal="'+k+'" data-id="'+id+'">'
        + '<img src="'+src+'" alt=""><span>'+(k===0 ? 'Cover' : 'Contoh isi'+(imgs.length>2 ? ' '+k : ''))+'</span></button>'
      ).join('') + '</div>';
    }
  } else {
    gallery = '<div class="gal-main gal-emoji">'+p.emoji+'</div>';
  }
  let info = '<span class="cat">'+p.category+'</span><h2>'+p.name+'</h2>'
    + (p.sub ? '<p class="sub">'+p.sub+'</p>' : '')
    + '<div class="price big">'+rp(p.price)+'</div>'
    + '<ul class="facts">'
    + (p.pages ? '<li>📄 '+p.pages+'</li>' : '')
    + '<li>📥 Format PDF, dikirim lewat WhatsApp setelah pembayaran dikonfirmasi</li></ul>';
  (p.long || [p.desc]).forEach(t => info += '<p class="long">'+t+'</p>');
  if (p.benefits){
    info += '<p class="long"><strong>'+(p.benefitsTitle || 'Manfaat:')+'</strong></p><ul class="benefits">'
      + p.benefits.map(b => '<li>'+b+'</li>').join('') + '</ul>';
  }
  if (p.fit) info += '<p class="long">'+p.fit+'</p>';
  info += cartControls(p);
  return '<a class="back-link" href="#produk">← Semua Produk</a>' + digitalNote()
    + '<div class="detail"><div class="gallery">'+gallery+'</div><div class="detail-info">'+info+'</div></div>';
}

function bindGallery(){
  document.querySelectorAll('[data-gal]').forEach(b => {
    b.addEventListener('click', () => { galIdx[b.getAttribute('data-id')] = parseInt(b.getAttribute('data-gal'),10); render(); });
  });
}

function bindProductChecks(){
  document.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', () => changeQty(btn.getAttribute('data-id'), 1));
  });
  document.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      changeQty(btn.getAttribute('data-id'), btn.getAttribute('data-act') === 'inc' ? 1 : -1);
    });
  });
}

function viewDasbor(){
  return '<section class="hero">'
    + digitalNote()
    + '<h1>Belajar & berkarya lebih gampang, tinggal download</h1>'
    + '<p>E-book, template, dan produk digital lain yang siap pakai langsung setelah kamu checkout.</p>'
    + '<a class="btn btn-primary" href="#produk">Lihat Semua Produk</a>'
    + '<div class="quicklinks">'
    + '<a class="qcard" href="#produk"><h3>📚 Produk</h3><p>Semua produk digital yang tersedia</p></a>'
    + '<a class="qcard" href="#kategori"><h3>🗂️ Kategori</h3><p>Produk dikelompokkan per jenis</p></a>'
    + '<a class="qcard" href="#keranjang"><h3>🛒 Keranjang</h3><p>Lihat & selesaikan pesananmu</p></a>'
    + '</div></section>';
}

function viewProduk(){
  let html = digitalNote() + '<div class="page-head"><h2>Semua Produk</h2><p>Klik produk untuk lihat contoh isinya, lalu tambahkan ke keranjang.</p></div><div class="grid">';
  PRODUCTS.forEach(p => html += productCard(p));
  html += '</div>';
  return html;
}

function viewKategori(sub){
  const cats = [...new Set(PRODUCTS.map(p => p.category))];
  if (!sub){
    let html = digitalNote() + '<div class="page-head"><h2>Kategori Produk</h2><p>Klik salah satu folder buat lihat isinya.</p></div><div class="grid">';
    cats.forEach(cat => {
      const count = PRODUCTS.filter(p => p.category === cat).length;
      html += '<a class="folder-card" href="#kategori/'+encodeURIComponent(cat)+'">'
        + '<div class="folder-icon">📁</div>'
        + '<h3>'+cat+'</h3>'
        + '<div class="count">'+count+' produk</div>'
        + '</a>';
    });
    html += '</div>';
    return html;
  }
  const cat = decodeURIComponent(sub);
  let html = '<a class="back-link" href="#kategori">← Semua Kategori</a>' + digitalNote()
    + '<div class="page-head"><h2>📁 '+cat+'</h2><p>Klik produk untuk lihat contoh isinya, lalu tambahkan ke keranjang.</p></div><div class="grid">';
  PRODUCTS.filter(p => p.category === cat).forEach(p => html += productCard(p));
  html += '</div>';
  return html;
}

function copyBtnHtml(value){
  return '<button type="button" class="copy-btn" data-copy="'+value.replace(/"/g,'&quot;')+'">Salin</button>';
}

const ORDER_KEY = 'laurel_last_order';
let lastOrder = null;
try {
  lastOrder = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
  if (lastOrder && Date.now() - (lastOrder.ts || 0) > 3*24*3600*1000) lastOrder = null; // kedaluwarsa 3 hari
} catch(e) { lastOrder = null; }
function setOrder(o){
  lastOrder = o;
  try { if (o) localStorage.setItem(ORDER_KEY, JSON.stringify(o)); else localStorage.removeItem(ORDER_KEY); } catch(e){}
}
function esc(t){
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function paymentCard(o){
  const waMsg = 'Halo, saya ' + o.name + '. Ini bukti transfer untuk pesanan: ' + o.list + (o.total ? ' (total ' + o.total + ')' : '') + '.';
  const waUrl = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waMsg);
  return '<div class="pay order-done">'
    + '<h3 class="done-title">✅ Pesanan tercatat, tinggal bayar</h3>'
    + '<ol class="steps">'
    + '<li>Sudah klik <strong>Kirim</strong> di tab konfirmasi? Kalau belum, <a href="'+o.formUrl+'" target="_blank" rel="noopener">buka lagi di sini</a>.</li>'
    + '<li>Transfer '+(o.total ? '<strong>'+o.total+'</strong> ' : '')+'ke data di bawah.</li>'
    + '<li>Kirim bukti transfer lewat tombol WhatsApp di bawah. File dikirim setelah pembayaran dikonfirmasi.</li>'
    + '</ol>'
    + '<div class="pay-grid" style="'+(QRIS_IMG ? '' : 'grid-template-columns:1fr;')+'">'
    + (QRIS_IMG ? '<div class="qris-wrap"><div class="qris-box"><img src="'+QRIS_IMG+'" alt="QRIS" style="width:100%;border-radius:10px;"></div>'
        + '<a class="btn btn-save-qr" href="'+QRIS_IMG+'" download="QRIS-StudioLaurel.png">⬇ Simpan Gambar QR</a></div>' : '')
    + '<div>'
    + '<div class="acc-row"><div><span>Pesanan atas nama</span><strong>'+esc(o.name)+'</strong></div></div>'
    + '<div class="acc-row"><div><span>Produk</span><strong>'+o.list+'</strong></div></div>'
    + '<div class="acc-row"><div><span>Bank/E-wallet</span><strong>'+BANK+'</strong></div></div>'
    + '<div class="acc-row"><div><span>No. Rekening</span><strong>'+NOREK+'</strong></div>'+copyBtnHtml(NOREK)+'</div>'
    + '<div class="acc-row"><div><span>Atas Nama</span><strong>'+ATASNAMA+'</strong></div></div>'
    + '</div></div>'
    + '<a class="btn btn-wa" href="'+waUrl+'" target="_blank" rel="noopener">Kirim Bukti Transfer via WhatsApp</a>'
    + '<button type="button" class="link-btn" id="newOrderBtn">Buat pesanan baru</button>'
    + '<p class="wa-note">Admin akan membalas secepat mungkin (estimasi maks 1x24 jam).</p>'
    + '</div>';
}

function viewKeranjang(){
  const cart = getCart();
  const items = PRODUCTS.filter(p => cart[p.id]);
  let html = '<div class="page-head"><h2>Keranjang & Pembayaran</h2><p>Cek pesananmu, isi data diri, lalu lanjut bayar.</p></div>';
  if (lastOrder) html += paymentCard(lastOrder);
  if (items.length === 0){
    if (!lastOrder) html += '<div class="empty-cart">Keranjang masih kosong. <a href="#produk">Pilih produk dulu yuk</a>.</div>';
    return html;
  }
  if (lastOrder) html += '<h3 class="next-title">Pesanan baru</h3>';
  html += '<div class="cart-list">';
  let total = 0, totalValid = true;
  items.forEach(p => {
    const qty = cart[p.id];
    const numeric = parseFloat(String(p.price).replace(/[^\d.]/g,''));
    if (isNaN(numeric)) totalValid = false; else total += numeric * qty;
    html += '<div class="cart-item"><div><strong>'+p.name+'</strong><br><span style="color:var(--muted);font-size:13px;">'+rp(p.price)+' / item</span></div>'
      + '<div class="qty-stepper" data-id="'+p.id+'">'
      + '<button type="button" class="qty-btn" data-act="dec" data-id="'+p.id+'">−</button>'
      + '<span class="qty-val">'+qty+'</span>'
      + '<button type="button" class="qty-btn" data-act="inc" data-id="'+p.id+'">+</button>'
      + '</div></div>';
  });
  html += '</div>';
  if (totalValid) html += '<div class="cart-total">Total: <strong>Rp '+total.toLocaleString('id-ID')+'</strong></div>';
  html += '<div class="pay">'
    + '<form id="checkoutForm" class="checkout-form">'
    + '<p class="form-hint">Isi data diri dulu. Nanti kebuka tab baru untuk konfirmasi, klik "Kirim" di sana, lalu kembali ke tab ini untuk bayar.</p>'
    + '<label>Nama Lengkap<input type="text" id="ckName" required placeholder="Nama kamu"></label>'
    + '<label>No. WhatsApp / Email<input type="text" id="ckContact" required placeholder="08xxxxxxxxxx atau email"></label>'
    + '<button type="submit" class="btn btn-primary" style="margin-top:4px;">Lanjut ke Pembayaran</button>'
    + '</form></div>';
  return html;
}

function bindKeranjang(){
  document.querySelectorAll('.copy-btn').forEach(b => {
    b.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(b.getAttribute('data-copy'));
        b.textContent = 'Tersalin ✓';
        setTimeout(() => b.textContent = 'Salin', 1500);
      } catch(e){}
    });
  });
  const nb = document.getElementById('newOrderBtn');
  if (nb) nb.addEventListener('click', () => { setOrder(null); render(); });

  const form = document.getElementById('checkoutForm');
  if (!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('ckName').value.trim();
    const contact = document.getElementById('ckContact').value.trim();
    if (!name || !contact) return;
    const cart = getCart();
    const items = PRODUCTS.filter(p => cart[p.id]);
    const list = items.map(p => p.name + ' x' + cart[p.id]).join(', ') || '(tidak ada produk)';
    let total = 0, ok = true;
    items.forEach(p => { const n = parseFloat(String(p.price).replace(/[^\d.]/g,'')); if (isNaN(n)) ok = false; else total += n * cart[p.id]; });

    const formUrl = 'https://docs.google.com/forms/d/e/'+GFORM_ID+'/viewform?usp=pp_url'
      + '&entry.'+ENTRY_NAMA+'='+encodeURIComponent(name)
      + '&entry.'+ENTRY_KONTAK+'='+encodeURIComponent(contact+' | Produk: '+list);
    window.open(formUrl, '_blank');

    setOrder({ name, contact, list, total: ok ? 'Rp ' + total.toLocaleString('id-ID') : '', formUrl, ts: Date.now() });
    setCart({});
    render();
    window.scrollTo(0,0);
  });
}

function render(){
  const raw = (location.hash || '#dasbor').replace('#','');
  const [route, sub] = raw.split('/');
  const app = document.getElementById('app');
  if (route === 'produk') app.innerHTML = viewProduk();
  else if (route === 'kategori') app.innerHTML = viewKategori(sub);
  else if (route === 'keranjang') app.innerHTML = viewKeranjang();
  else if (route === 'detail') app.innerHTML = viewDetail(sub);
  else app.innerHTML = viewDasbor();

  document.querySelectorAll('#navlinks a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('data-r') === (route === 'detail' ? 'produk' : route));
  });
  bindProductChecks();
  bindGallery();
  bindKeranjang();
  updateBadge();
  updateWaLink();
}

window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
window.addEventListener('DOMContentLoaded', render);
render();
</script>
</body>
</html>
